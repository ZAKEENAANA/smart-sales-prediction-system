<!DOCTYPE html>
<html>
<head>
    <title>Total Revenue Prediction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2>💰 Total Revenue Prediction for SKU Over Period</h2>
    <form method="POST">
        <div class="mb-3">
            <label>SKU</label>
            <input type="text" name="sku" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Year</label>
            <input type="number" name="year" class="form-control" min="2020" max="2100" required>
        </div>
        <div class="mb-3">
            <label>Start Month</label>
            <input type="number" name="start_month" class="form-control" min="1" max="12" required>
        </div>
        <div class="mb-3">
            <label>End Month</label>
            <input type="number" name="end_month" class="form-control" min="1" max="12" required>
        </div>
        <button type="submit" class="btn btn-primary">Predict Total Revenue</button>
    </form>

    {% if total_revenue is not none %}
    <div class="alert alert-success mt-4">
        <h4>Total Predicted Revenue: Rs. {{ total_revenue }}</h4>
    </div>
    {% endif %}

    <a href="/dashboard" class="btn btn-secondary mt-3">⬅ Back to Dashboard</a>
</div>
</body>
</html>
